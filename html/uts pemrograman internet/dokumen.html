<!DOCTYPE html>
<html>
<head>
    <title>Daftar Mata Kuliah</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2356c4;
            color: white;
        }

        /* Warna baris ganjil */
        tr:nth-child(odd) {
            background-color: #7bc6ec;
        }

        /* Warna baris genap */
        tr:nth-child(even) {
            background-color: #ffffff;
        }

        /* Kursor saat berada di baris */
        tbody tr {
            cursor: pointer;
        }

        /* Efek ketika kursor diarahkan */
        tbody tr:hover {
            background-color: #7bc6ec;
        }
    </style>
</head>

<body>

    <h2>DAFTAR MATA KULIAH</h2>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Kode Mata Kuliah</th>
                <th>Nama Mata Kuliah</th>
                <th>Jumlah SKS</th>
                <th>Semester</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>IF101</td>
                <td>Pemrograman Dasar</td>
                <td>3</td>
                <td>1</td>
            </tr>

            <tr>
                <td>2</td>
                <td>IF102</td>
                <td>Basis Data</td>
                <td>3</td>
                <td>2</td>
            </tr>

            <tr>
                <td>3</td>
                <td>IF103</td>
                <td>Komunikasi Data</td>
                <td>2</td>
                <td>3</td>
            </tr>

            <tr>
                <td>4</td>
                <td>IF104</td>
                <td>Kecerdasan Buatan</td>
                <td>3</td>
                <td>4</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
